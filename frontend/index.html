<style>
  body{background:#07070b;color:#e8e8f0;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#0d0d14}
  ::-webkit-scrollbar-thumb{background:#343440;border-radius:999px}
  .glass{background:rgba(255,255,255,.035);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)}
  .soft{background:rgba(255,255,255,.025)}
  .badge-offer{background:#1d4ed8;color:#bfdbfe}
  .badge-counter{background:#6b21a8;color:#e9d5ff}
  .badge-accept{background:#065f46;color:#a7f3d0}
  .badge-walk_away{background:#7f1d1d;color:#fca5a5}
  .badge-allowed{background:#065f46;color:#a7f3d0}
  .badge-blocked{background:#7f1d1d;color:#fca5a5}
  .pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.45}

  input,select{
    background:#0d1018;
    border:1px solid #303747;
    color:#e8e8f0;
    border-radius:7px;
    padding:7px 10px;

    outline:none

  label{
    font-size:.7rem;
    color:#9ca3af;
    display:block;
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:.06em
  }
  .btn{
    border-radius:8px;

    font-weight:700;
    cursor:pointer;

  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:#4f46e5;color:white}
  .btn-primary:hover{background:#4338ca}
  .btn-secondary{
    background:#151922;
    color:#e8e8f0;
    border:1px solid #303747
  }
  .btn-secondary:hover{background:#202633}
  .kpi{
    background:linear-gradient(
      180deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,.025)
    );
    border:1px solid rgba(255,255,255,.08)

  .simple-card{
    background:linear-gradient(
      180deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.02)
    );
    border:1px solid rgba(255,255,255,.08)
  }
  .step-dot{
    width:28px;
    height:28px;
    display:grid;
    place-items:center;
    border-radius:999px;
    background:#1d2330;
    color:#c7d2fe;
    font-size:12px;
    font-weight:800;
    flex:none
  }
  .friendly-input{
    font-size:.95rem !important;
    padding:11px 12px !important;
    border-radius:10px !important
  }
  .stage-running{
    box-shadow:
      0 0 0 1px rgba(99,102,241,.2),
      0 0 30px rgba(99,102,241,.08)
  }
  .trace-live{
    background:rgba(15,23,42,.7);
    border:1px solid rgba(99,102,241,.18);
  }
  .trace-dot{
    width:8px;
    height:8px;
    border-radius:999px;
    background:#818cf8;
    box-shadow:0 0 0 5px rgba(129,140,248,.08);

    height:4px;
    background:rgba(255,255,255,.06);

function Badge({text,type}){
  const cls=
    `badge-${(
      type
      ||
      text
      ||

      .toLowerCase()
      .replace(/ /g,"_")}`;

    >

    </span>
  );

function Stat({label,value}){

      <span className="text-[11px] text-gray-500">
        {label}

      </span>
    </div>
  );
}

function UtilityBar({value,label}){

      <div className="flex justify-between text-[11px] mb-1">
        <span className="text-gray-500">
          {label}
        </span>

        <span className="font-semibold">
          {Math.round(value*100)}%

      </div>

      <div className="h-1.5 rounded-full bg-white/10 overflow-hidden">
        <div
          className="h-full bg-indigo-500 rounded-full"
          style={{
            width:`${
              Math.max(
                0,
                Math.min(
                  100,
                  value*100
                )
              )
            }%`

  );

function PolicyForm({label,defaults,onChange}){
  const [d,setD]=useState(defaults);

  useEffect(
    ()=>onChange(d),
    [d]
  );

  const up=(path,val)=>
    setD(
      prev=>{
        const n={...prev};
        const parts=path.split(".");
        let cur=n;

        for(
          let i=0;
          i<parts.length-1;
          i++
        ){
          cur[parts[i]]={
            ...cur[parts[i]]
          };

          cur=cur[parts[i]];
        }

        cur[parts.at(-1)] =
          isNaN(val)
          ?val
          :+val;

        return n;
      }
    );

  const F=({
    p,
    l,
    min,
    max,
    step=1
  })=>
    <div>
      <label>{l}</label>

      <input
        type="number"
        min={min}
        max={max}
        step={step}
        value={
          p
            .split(".")
            .reduce(
              (o,k)=>o?.[k],
              d
            )
          ??""
        }
        onChange={
          e=>up(
            p,
            e.target.value
          )
        }
      />
    </div>;

  const buyer=
    label
      .toLowerCase()
      .includes("buyer");

  return (
    <div className="glass rounded-2xl p-5">

      <div className="flex items-center justify-between mb-4">

        <div>
          <h3 className="font-black text-sm uppercase tracking-widest">
            {label}
          </h3>

          <p className="text-[10px] text-gray-500 mt-1">
            🔒 PRIVATE BUSINESS RULES — hidden from the other agent
          </p>
        </div>

        <span className="text-[10px] px-2 py-1 rounded-full bg-white/5 text-gray-400">
          {buyer?"BUYER":"SUPPLIER"} CONTROL
        </span>

      </div>

      <div className="grid grid-cols-2 gap-3">

        <F
          p="price.target"
          l="Target Price (₹)"
          min={1}
        />

        <F
          p={
            buyer
            ?"price.maximum"
            :"price.minimum"
          }
          l={
            buyer
            ?"Max Price (₹)"
            :"Min Price (₹)"
          }
          min={1}
        />

        <F
          p="delivery.target_days"
          l="Delivery Target"
          min={1}
        />

        <F
          p="delivery.maximum_days"
          l="Max Delivery"
          min={1}
        />

        <F
          p="payment.preferred_days"
          l="Preferred Net"
          min={1}
        />

        <F
          p="payment.minimum_days"
          l="Min Net"
          min={1}
        />

        <F
          p="sla.minimum_uptime"
          l="Min Uptime %"
          min={95}
          max={100}
          step={0.5}
        />

        <F
          p="sla.maximum_penalty"
          l="Max Penalty %"
          min={0}
          step={0.5}
        />

        <F
          p="max_rounds"
          l="Max Rounds"
          min={1}
          max={20}
        />

        <F
          p="sla.minimum_penalty"
          l="Min Penalty %"
          min={0}
          step={0.5}
        />

      </div>

      <div className="mt-3">
        <label>BATNA</label>

        <input
          value={d.batna||""}
          onChange={
            e=>up(
              "batna",
              e.target.value
            )
          }
        />
      </div>

    </div>
  );
}

function NegotiationChart({rounds}){
  const data=
    (rounds||[]).map(
      (r,i)=>({
        round:i+1,
        buyer:r.buyer?.price??null,
        supplier:r.supplier?.price??null
      })
    );

  return (
    <div className="w-full h-72">

      <ResponsiveContainer
        width="100%"
        height="100%"
      >

        <LineChart data={data}>

          <CartesianGrid
            strokeDasharray="3 3"
            opacity={0.1}
          />

          <XAxis
            dataKey="round"
            stroke="#6b7280"
            fontSize={10}
          />

          <YAxis
            stroke="#6b7280"
            fontSize={10}
          />

          <Tooltip
            contentStyle={{
              background:"#11131b",
              border:"1px solid #303747",
              borderRadius:"10px",
              color:"#fff"
            }}
          />

          <Legend />

          <Line
            type="monotone"
            dataKey="buyer"
            stroke="#818cf8"
            strokeWidth={2}
            dot={false}
          />

          <Line
            type="monotone"
            dataKey="supplier"
            stroke="#34d399"
            strokeWidth={2}
            dot={false}
          />

        </LineChart>

      </ResponsiveContainer>

    </div>
  );
}

function SecurityPanel({
  request,
  security,
  setSecurity
}){

  const [scenario,setScenario]=useState(
    "prompt_injection"
  );

  const runSecurity=async()=>{

    setSecurity({
      loading:true
    });

    try{

      const r=await fetch(
        `${API}/api/security/red-team`,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            scenario,
            request
          })
        }
      );

      const d=await r.json();

      setSecurity(d);

    }catch(e){

      setSecurity({
        error:e?.message
      });

    }
  };

  return (
    <div className="glass rounded-2xl p-5">

      <div className="text-[10px] uppercase tracking-wider text-gray-500">
        Security testing
      </div>

      <h3 className="font-black mt-1">
        Guardrail red-team
      </h3>

      <p className="text-xs text-gray-500 mt-1">
        Test prompt injection, policy violations, and unsafe proposals.
      </p>

      <div className="mt-4">

        <label>
          Scenario
        </label>

        <select
          value={scenario}
          onChange={
            e=>setScenario(e.target.value)
          }
        >
          <option value="prompt_injection">
            Prompt injection
          </option>

          <option value="price_violation">
            Price violation
          </option>

          <option value="delivery_violation">
            Delivery violation
          </option>
        </select>

      </div>

      <button
        className="btn btn-secondary mt-4"
        onClick={runSecurity}
        disabled={security?.loading}
      >
        {security?.loading
          ?"Testing..."
          :"Run security test"
        }
      </button>

      {security?.error&&
        <div className="text-xs text-red-300 mt-3">
          {security.error}
        </div>
      }

      {security&&!security.loading&&!security.error&&
        <div className="mt-4 soft rounded-xl p-3">

          <div className="flex items-center justify-between">

            <span className="text-[10px] text-gray-500 uppercase">
              Result

function RFQPanel({payload}){

  const [rfq,setRfq]=useState(null);
  const [loading,setLoading]=useState(false);

  const runRFQ=async()=>{

    setLoading(true);
    setRfq(null);

    try{

      const r=await fetch(
        `${API}/api/autonomous/procure`,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            text:
              `Product: ${payload.product_name}. Quantity: ${payload.quantity} units.`,
            suppliers:
              AUTONOMOUS_SUPPLIERS,
            buyer:payload.buyer,
            buyer_name:
              payload.buyer_name,
            max_attempts:3,
            minimum_confidence:0.4,
            minimum_supplier_score:0.3,
            execution_mode:"simulation"
          })
        }
      );

      const d=await r.json();

      if(!r.ok){

        throw new Error(
          typeof d.detail==="string"
          ?d.detail
          :JSON.stringify(
              d.detail||d
            )
        );

      }

      setRfq(d);

    }catch(e){

      setRfq({
        error:e.message
      });

    }finally{

      setLoading(false);

    }
  };

  return (
    <div className="glass rounded-2xl p-5">

      <div className="text-[10px] uppercase tracking-wider text-gray-500">
        Multi-supplier RFQ
      </div>

      <h3 className="font-black mt-1">
        Autonomous supplier selection
      </h3>

      <p className="text-xs text-gray-500 mt-1">
        Compare multiple suppliers and let Nexora choose the strongest candidate.
      </p>

      <button
        className="btn btn-primary mt-4"
        onClick={runRFQ}
        disabled={loading}
      >
        {loading
          ?"Running RFQ..."
          :"Run 3-supplier RFQ"
        }
      </button>

      {rfq?.error&&
        <div className="text-xs text-red-300 mt-3">
          {rfq.error}
        </div>
      }

      {rfq&&!rfq.error&&
        <div className="mt-4">

          <div className="grid grid-cols-2 gap-2">

            <div className="soft rounded-xl p-3">
              <div className="text-[9px] text-gray-600">
                SELECTED
              </div>

              <div className="font-black text-sm mt-1">
                {rfq.selected_supplier?.supplier?.name
                  ||"—"
                }

            </div>

            <div className="soft rounded-xl p-3">
              <div className="text-[9px] text-gray-600">
                VERIFIED
              </div>

              <div className="font-black text-sm mt-1">
                {rfq.verified

                    </div>
                    <div className="text-sm font-bold text-gray-100 mt-1">
                      1,000 industrial servo motors · ₹120K ceiling · ≤30 days · Net 60 · 98% SLA
                    </div>
                    <div className="text-[11px] text-gray-500 mt-1">
                      Uses the real Nexora pipeline with live supplier evidence and the configured Lyzr runtime.
                    </div>
                  </div>
                  {judgeMode&&
                    <span className="text-[10px] px-2 py-1 rounded-full bg-indigo-500/15 text-indigo-300 font-bold uppercase">
                      Flagship loaded
                    </span>
                  }
                </div>
              </div>

              <div className="flex flex-wrap gap-3 mt-6">

                <button
                  className="btn btn-primary"
                  onClick={runFlagshipDemo}
                  disabled={loading}
                  title="Runs the curated judge scenario through the real autonomous pipeline."
                >
                  {loading
                    ?"Running flagship demo..."
                    :"🎬 Run flagship judge demo"
                  }
                </button>

                <button
                  className="btn btn-secondary"
                  onClick={run}
                  disabled={loading}
                >
                  ⚡ Run current request
                </button>

                <button
                  className="btn btn-secondary"
                  onClick={()=>setShowAdvanced(!showAdvanced)}
                >
                  {showAdvanced
                    ?"Hide controls"
                    :"Show controls"
                  }
                  {" "}▾
                </button>

              </div>

              {loading&&

                <div className="mt-4 flex items-center gap-2 text-xs text-indigo-300">
                  <span className="pulse">
                    ●
                  </span>
                  Nexora is executing the procurement workflow...
                </div>

              }

              {err&&

                <div className="mt-4 rounded-xl border border-red-900/30 bg-red-950/20 p-3 text-xs text-red-300">
                  {err}
                </div>

              }

            </div>

            <div className="grid grid-cols-2 gap-3">

              <div className="kpi rounded-2xl p-4">
                <div className="text-[10px] text-gray-500">
                  AGENT
                </div>
                <div className="text-2xl font-black mt-1">
                  LYZR
                </div>
                <div className="text-xs text-gray-500 mt-1">
                  Buyer + supplier runtime
                </div>
              </div>

              <div className="kpi rounded-2xl p-4">
                <div className="text-[10px] text-gray-500">
                  WEB EVIDENCE
                </div>
                <div className="text-2xl font-black mt-1">
                  ANAKIN
                </div>
                <div className="text-xs text-gray-500 mt-1">
                  Live supplier pages
                </div>
              </div>

              <div className="kpi rounded-2xl p-4">
                <div className="text-[10px] text-gray-500">
                  GOVERNANCE
                </div>
                <div className="text-2xl font-black mt-1">
                  ON
                </div>
                <div className="text-xs text-gray-500 mt-1">
                  Policy + legal + risk
                </div>
              </div>

              <div className="kpi rounded-2xl p-4">
                <div className="text-[10px] text-gray-500">
                  RECOVERY
                </div>
                <div className="text-2xl font-black mt-1">
                  AUTO
                </div>
                <div className="text-xs text-gray-500 mt-1">
                  Bounded supplier retry
                </div>
              </div>

              <div className="kpi rounded-2xl p-4">
                <div className="text-[10px] text-gray-500">
                  VERIFICATION
                </div>
                <div className="text-2xl font-black mt-1">
                  HARD
                </div>
                <div className="text-xs text-gray-500 mt-1">
                  Independent validation
                </div>
              </div>

            </div>

          </div>

        </section>

        <details
          className="glass rounded-3xl p-5 md:p-6"
          open={showAdvanced}
        >

          <summary>
            <div className="flex items-center justify-between gap-4">

              <div>

                <p className="text-[11px] uppercase tracking-widest text-gray-500">
                  Procurement configuration
                </p>

                <h3 className="text-lg font-black mt-1">
                  Buyer and supplier controls
                </h3>

                <p className="text-xs text-gray-500 mt-1">
                  Private negotiation policy stays isolated from the other party. Public supplier pages are read live through Anakin; negotiation policies shown here are the bounded demo policies used by Nexora.
                </p>

              </div>

              <span className="text-xs text-indigo-300 font-bold">
                {showAdvanced
                  ?"Hide controls"
                  :"Show controls"
                } ▾
              </span>

            </div>
          </summary>

          <div className="grid lg:grid-cols-2 gap-4 mt-5">

            <PolicyForm
              label="Buyer Policy"
              defaults={BUYER_DEF}
              onChange={setBuyer}
            />

            <PolicyForm
              label="Supplier Policy"
              defaults={SUPP_DEF}
              onChange={setSupplier}
            />

          </div>

          <div className="grid lg:grid-cols-3 gap-4 mt-4">

            <div>

              <label>
                Buyer name
              </label>

              <input
                className="friendly-input"
                value={buyerName}
                onChange={
                  e=>setBuyerName(
                    e.target.value
                  )
                }
              />

            </div>

            <div>

              <label>
                Supplier name
              </label>

              <input
                className="friendly-input"
                value={supplierName}
                onChange={
                  e=>setSupplierName(
                    e.target.value
                  )
                }
              />

            </div>

            <div>

              <label>
                Quantity
              </label>

              <input
                className="friendly-input"
                type="number"
                min="1"
                value={qty}
                onChange={
                  e=>setQty(
                    e.target.value
                  )
                }
              />

            </div>

          </div>

          <div className="mt-4">

            <label>
              Product
            </label>

            <input
              className="friendly-input"
              value={product}
              onChange={
                e=>setProduct(
                  e.target.value
                )
              }
            />

          </div>

        </details>

        {workflow&&
          <DecisionTrace
            workflow={workflow}
          />
        }

        {result&&

          <>

            <section className="glass rounded-3xl p-5 md:p-6">

              <div className="flex flex-wrap items-start justify-between gap-4">

                <div>

                  <p className="text-[11px] uppercase tracking-[.18em] text-indigo-300 font-bold">
                    Negotiation result
                  </p>

                  <h3 className="text-2xl font-black mt-1">
                    {result.status
                      ?"Agreement "
                      +String(
                        result.status
                      ).toLowerCase()
                      :"Completed"
                    }
                  </h3>

                  <p className="text-xs text-gray-500 mt-2">
                    Autonomous negotiation output from Nexora's existing negotiation engine.
                  </p>

                </div>

                <Badge
                  text={
                    result.status
                    ||"COMPLETE"
                  }
                  type={
                    result.status
                  }
                />

              </div>

              <div className="grid md:grid-cols-4 gap-3 mt-6">

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    PRICE
                  </div>

                  <div className="text-2xl font-black mt-1">
                    ₹{Number(
                      lastBuyer?.price
                      ??
                      lastSupplier?.price
                      ??
                      0
                    ).toLocaleString()}
                  </div>

                  <div className="text-xs text-gray-500 mt-1">
                    Latest negotiated price
                  </div>

                </div>

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    DELIVERY
                  </div>

                  <div className="text-2xl font-black mt-1">
                    {lastBuyer?.delivery_days
                      ??
                      lastSupplier?.delivery_days
                      ??
                      "—"
                    }{" "}
                    days
                  </div>

                  <div className="text-xs text-gray-500 mt-1">
                    Agreed timeline
                  </div>

                </div>

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    PAYMENT
                  </div>

                  <div className="text-2xl font-black mt-1">
                    Net{" "}
                    {lastBuyer?.payment_days
                      ??
                      lastSupplier?.payment_days
                      ??
                      "—"
                    }
                  </div>

                  <div className="text-xs text-gray-500 mt-1">
                    Payment term
                  </div>

                </div>

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    RISK
                  </div>

                  <div
                    className={`text-2xl font-black mt-1 ${
                      ri?.label==="LOW"
                      ?"text-emerald-300"
                      :ri?.label==="MEDIUM"
                      ?"text-yellow-300"
                      :"text-red-300"
                    }`}
                  >
                    {ri?.label||"—"}
                  </div>

                  <div className="text-xs text-gray-500 mt-1">
                    Policy risk level
                  </div>

                </div>

              </div>

            </section>

            {result.contract&&

              <ContractCard
                contract={
                  result.contract
                }
                negId={
                  result.negotiation_id
                }
              />

            }

            <details
              className="glass rounded-3xl p-5 md:p-6"
            >

              <summary>

                <div className="flex items-center justify-between gap-4">

                  <div>

                    <p className="text-[11px] uppercase tracking-widest text-gray-500">
                      Optional detail
                    </p>

                    <h3 className="text-lg font-black mt-1">
                      See how the agents negotiated
                    </h3>

                    <p className="text-xs text-gray-500 mt-1">
                      Charts, round-by-round proposals, trust checks, and audit history.
                    </p>

                  </div>

                  <span className="text-xs text-indigo-300 font-bold">
                    Open details ▾
                  </span>

                </div>

              </summary>

              <div className="mt-5 grid md:grid-cols-5 gap-3">

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    ROUNDS
                  </div>

                  <div className="text-xl font-black mt-1">
                    {result.rounds?.length||0}
                  </div>

                </div>

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    CONVERGENCE
                  </div>

                  <div className="text-xl font-black mt-1">
                    {Math.round(
                      (
                        result.convergence
                        ?.convergence_ratio
                        ||0
                      )*100
                    )}%
                  </div>

                </div>

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    JOINT UTILITY
                  </div>

                  <div className="text-xl font-black text-emerald-300 mt-1">
                    {Math.round(
                      (
                        lastMetrics
                        ?.joint_utility
                        ||0
                      )*100
                    )}%
                  </div>

                </div>

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    GOVERNANCE
                  </div>

                  <div className="text-sm font-black mt-2">
                    {result.governance
                      ?.external_responsible_ai_configured
                      ?"EXTERNAL GOVERNANCE"
                      :"LOCAL FIREWALL"
                    }
                  </div>

                </div>

                <div className="kpi rounded-2xl p-4">

                  <div className="text-[10px] text-gray-500">
                    AUDIT
                  </div>

                  <div
                    className={`text-sm font-black mt-2 ${
                      auditIntegrity?.valid
                      ?"text-emerald-300"
                      :"text-yellow-300"
                    }`}
                  >
                    {auditIntegrity?.valid
                      ?"✓ VERIFIED"
                      :"CHECKED"
                    }
                  </div>

                </div>

              </div>

              <section className="glass rounded-2xl p-5 mt-4">

                <div className="flex flex-wrap gap-2 border-b border-white/10 pb-3 mb-4">

                  {[
                    [
                      "arena",
                      "📈 Deal path"
                    ],
                    [
                      "rounds",
                      "📋 Round history"
                    ],
                    [
                      "audit",
                      "🔒 Trust & audit"
                    ]
                  ].map(
                    ([k,l])=>

                      <button
                        key={k}
                        onClick={
                          ()=>setTab(k)
                        }
                        className={`px-4 py-2 rounded-full text-xs font-bold ${
                          tab===k
                          ?"bg-indigo-600 text-white"
                          :"text-gray-400 hover:text-white"
                        }`}
                      >
                        {l}
                      </button>
                  )}

                </div>

                {tab==="arena"

                  ?<NegotiationChart
                    rounds={
                      result.rounds
                    }
                  />

                  :tab==="rounds"

                  ?<Rounds
                    rounds={
                      result.rounds
                    }
                  />

                  :<>
                    <Audit
                      events={audit}
                    />

                    <div className="flex justify-end mt-3">

                      <span
                        className={`text-xs font-bold ${
                          auditIntegrity?.valid
                          ?"text-emerald-300"
                          :"text-red-300"
                        }`}
                      >
                        {auditIntegrity?.valid
                          ?"✓ HASH CHAIN VERIFIED"
                          :"✕ AUDIT INTEGRITY FAILED"
                        }

                        {" · "}

                        {auditIntegrity?.events
                          ||0
                        } events

                      </span>

                    </div>

                  </>

                }

              </section>

              <div className="grid lg:grid-cols-2 gap-4 mt-4">

                <AgentPanel
                  name={buyerName}
                  role="buyer"
                  policy={buyer}
                  latest={lastBuyer}
                  metrics={
                    lastMetrics
                    ?.buyer_utility
                  }
                />

                <AgentPanel
                  name={supplierName}
                  role="supplier"
                  policy={supplier}
                  latest={lastSupplier}
                  metrics={
                    lastMetrics
                    ?.supplier_utility
                  }
                />

              </div>

              <ParetoPanel
                pareto={
                  result.pareto
                }
              />

            </details>

          </>

        }

        <details className="glass rounded-3xl p-5 md:p-6">

          <summary>

            <div className="flex items-center justify-between gap-4">

              <div>

                <p className="text-[11px] uppercase tracking-widest text-gray-500">
                  For testing & demos
                </p>

                <h3 className="text-lg font-black mt-1">
                  Security & multi-supplier tools
                </h3>

                <p className="text-xs text-gray-500 mt-1">
                  Red-team guardrail testing and 3-supplier RFQ are kept out of the main workflow.
                </p>

              </div>

              <span className="text-xs text-indigo-300 font-bold">
                Open tools ▾
              </span>

            </div>

          </summary>

          <div className="grid lg:grid-cols-2 gap-5 mt-5">

            <SecurityPanel
              request={payload}
              security={security}
              setSecurity={setSecurity}
            />

            <RFQPanel
              payload={payload}
            />

          </div>

        </details>

        <details className="glass rounded-3xl p-5 md:p-6">

          <summary>

            <div className="flex items-center justify-between gap-4">

              <div>

                <p className="text-[11px] uppercase tracking-widest text-gray-500">
                  Technical information
                </p>

                <h3 className="text-lg font-black mt-1">
                  How Nexora is governed
                </h3>

                <p className="text-xs text-gray-500 mt-1">
                  A closer look at the agent, validation, and audit boundaries.
                </p>

              </div>

              <span className="text-xs text-indigo-300 font-bold">
                Open architecture ▾
              </span>

            </div>

          </summary>

          <div className="mt-5">

            <SystemArchitecture/>

          </div>

        </details>

        {!result&&!loading&&!err&&

          <div className="text-center py-8 text-gray-500">

            <div className="text-4xl mb-3">
              🧠
            </div>

            <p className="text-sm">
              Your autonomous procurement run is ready.
            </p>

            <p className="text-xs mt-2">
              One action will execute READ → REASON → SELECT → ACT → VERIFY using the existing Nexora negotiation engine.
            </p>

          </div>

        }

        {result&&

          <div className="flex justify-end">

            <button
              className="btn btn-secondary"
              onClick={reset}
            >
              ↺ Start another deal
            </button>

          </div>

        }

      </main>

    </div>
  );
}

ReactDOM
  .createRoot(
    document.getElementById(
      "root"
    )
  )
  .render(
    <App/>
  );
</script>
</body>
</html>
